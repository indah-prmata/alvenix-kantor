<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penawaran — alvenix</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Outfit:wght@700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0d1b20; --body: #33454b; --muted: #6f8288; --line: #e2eaec; --soft: #f3f8f9; --teal: #13a3b2; --teal2: #22b8c6; --orange: #ef6a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9eff1; color: var(--body); font: 15px/1.6 "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .bar { position: sticky; top: 0; z-index: 10; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 12px 16px; background: rgba(6,16,21,.92); backdrop-filter: blur(10px); }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 999px; border: 0; font: 700 14.5px "Manrope", sans-serif; cursor: pointer; text-decoration: none; }
  .btn--wa { background: #1faa59; color: #fff; }
  .btn--ghost { background: rgba(255,255,255,.1); color: #fff; }
  .btn svg { width: 18px; height: 18px; }
  .doc { max-width: 820px; margin: 28px auto 60px; background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 70px -40px rgba(0,0,0,.35); }
  .top { position: relative; padding: 38px 44px 34px; background: #03080c; color: #cfe0e4; overflow: hidden; }
  .top::before { content: ""; position: absolute; width: 420px; height: 420px; right: -140px; top: -200px; border-radius: 50%; background: radial-gradient(circle, rgba(34,184,198,.5), transparent 65%); }
  .top > * { position: relative; }
  .brand { display: flex; align-items: center; gap: 9px; font: 700 22px "Outfit", sans-serif; color: #fff; letter-spacing: -.03em; }
  .brand svg { width: 30px; height: 30px; }
  .brand b { color: var(--orange); }
  .top h1 { font: 600 30px/1.1 "Unbounded", sans-serif; color: #fff; letter-spacing: -.03em; margin: 26px 0 6px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 26px; font: 12px "JetBrains Mono", monospace; color: #8fa4aa; letter-spacing: .04em; }
  .meta b { color: #e6f2f4; font-weight: 500; }
  .body { padding: 34px 44px 40px; }
  .to { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .lbl { display: block; font: 11px "JetBrains Mono", monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--teal); margin-bottom: 4px; }
  .to b { color: var(--ink); font-size: 17px; }
  h2 { font: 500 17px "Unbounded", sans-serif; color: var(--ink); margin: 28px 0 12px; letter-spacing: -.02em; }
  .pk { display: grid; grid-template-columns: 1fr auto; gap: 6px 20px; padding: 20px 22px; border-radius: 16px; background: var(--soft); border: 1.5px solid var(--teal2); }
  .pk h3 { margin: 0; font: 600 18px "Unbounded", sans-serif; color: var(--ink); letter-spacing: -.02em; }
  .pk .price { font: 800 24px "Manrope", sans-serif; color: var(--ink); letter-spacing: -.03em; text-align: right; }
  .pk p { grid-column: 1 / -1; margin: 0; color: var(--muted); }
  .pk ul { grid-column: 1 / -1; margin: 8px 0 0; padding-left: 18px; columns: 2; column-gap: 24px; }
  .incl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; margin: 0; padding: 0; list-style: none; }
  .incl li::before { content: "✓"; color: #1f9d5a; font-weight: 800; margin-right: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  td { padding: 11px 0; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-weight: 700; color: var(--ink); white-space: nowrap; }
  tr.total td { border-bottom: 0; font-size: 18px; color: var(--ink); font-weight: 800; padding-top: 16px; }
  tr.dp td { color: var(--teal); }
  .terms { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .terms div { padding: 14px 16px; border-radius: 14px; background: var(--soft); font-size: 14px; }
  .terms b { display: block; color: var(--ink); margin-bottom: 2px; }
  .sign { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
  .sign b { display: block; color: var(--ink); font-size: 15px; }
  .empty { max-width: 520px; margin: 80px auto; text-align: center; padding: 30px; background: #fff; border-radius: 20px; }
  @media (max-width: 620px) {
    .top, .body { padding-left: 22px; padding-right: 22px; }
    .to, .terms, .incl { grid-template-columns: 1fr; }
    .pk ul { columns: 1; }
    .doc { margin: 0; border-radius: 0; }
  }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .doc { margin: 0; box-shadow: none; border-radius: 0; max-width: none; }
    .top { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pk, .terms div { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>
<div class="bar">
  <a class="btn btn--wa" id="agree" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg>Setuju &amp; lanjut via WhatsApp</a>
  <button class="btn btn--ghost" type="button" onclick="print()">Simpan PDF / Cetak</button>
</div>
<main id="doc"></main>

<script src="config.js?v=20261028"></script>
<script src="shared.js?v=20261028"></script>
<script>
(() => {
  const CFG = window.HQ_CONFIG || {}, S = window.HQ_SHARED;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const Q = S.dec((location.hash.match(/q=([^&]+)/) || [])[1] || "");
  if (!Q) { document.getElementById("doc").innerHTML = `<div class="empty"><b>Link penawaran tidak lengkap.</b><p>Minta link terbaru ke tim ${esc(CFG.brand)} ya 🙏</p></div>`; document.querySelector(".bar").remove(); return; }
  const p = S.paket(Q.p);
  const tgl = new Date(Q.d || Date.now());
  const sampai = new Date(tgl); sampai.setDate(sampai.getDate() + (CFG.berlakuHari || 7));
  const fmt = d => d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
  const dp = Math.round(p.harga * (CFG.dpPersen || 50) / 100);
  document.title = `Penawaran ${Q.no} — ${Q.n}`;
  document.getElementById("doc").innerHTML = `
  <article class="doc">
    <header class="top">
      <div class="brand"><svg viewBox="0 0 100 100"><g stroke="#22b8c6" stroke-width="11" stroke-linecap="round" fill="none"><path d="M52 54 L18 58"/><path d="M52 54 Q58 34 80 20"/><path d="M52 54 Q60 72 77 84"/></g><g fill="#22b8c6"><circle cx="52" cy="54" r="15"/><circle cx="15" cy="58" r="12"/><circle cx="82" cy="18" r="12"/><circle cx="78" cy="86" r="12"/></g></svg><span>alveni<b>x</b></span></div>
      <h1>Penawaran Website</h1>
      <div class="meta"><span>No. <b>${esc(Q.no)}</b></span><span>Tanggal <b>${fmt(tgl)}</b></span><span>Berlaku s.d. <b>${fmt(sampai)}</b></span></div>
    </header>
    <div class="body">
      <div class="to">
        <div><span class="lbl">Untuk</span><b>${esc(Q.n)}</b>${Q.k ? `<br>${esc(Q.k)}` : ""}</div>
        <div><span class="lbl">Dari</span><b>${esc(CFG.brand)}</b><br>Jasa website &amp; landing page</div>
      </div>
      <h2>Paket yang ditawarkan</h2>
      <div class="pk"><h3>${esc(p.nama)}</h3><div class="price">${S.rupiah(p.harga)}</div><p>${esc(p.ringkas)}</p>
        <ul>${p.isi.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>
      <h2>Sudah termasuk</h2>
      <ul class="incl">${(CFG.termasuk || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <h2>Rincian biaya</h2>
      <table>
        ${p.hargaNormal > p.harga ? `<tr><td>Harga normal ${esc(p.nama)}</td><td><s style="color:var(--muted);font-weight:500">${S.rupiah(p.hargaNormal)}</s></td></tr><tr><td>Harga promo${CFG.promo ? " (" + esc(CFG.promo.toLowerCase()) + ")" : ""} — hemat ${S.hemat(p)}%</td><td style="color:#2f6bff">${S.rupiah(p.harga)}</td></tr>` : ""}<tr><td>${esc(p.nama)} — pembuatan + domain, hosting &amp; keamanan tahun pertama</td><td>${S.rupiah(p.harga)}</td></tr>
        <tr class="total"><td>Total</td><td>${S.rupiah(p.harga)}</td></tr>
        <tr class="dp"><td>Uang muka ${CFG.dpPersen || 50}% (untuk mulai pengerjaan)</td><td>${S.rupiah(dp)}</td></tr>
        <tr><td>Pelunasan — setelah website jadi &amp; disetujui</td><td>${S.rupiah(p.harga - dp)}</td></tr>
        <tr><td>Biaya tahunan mulai tahun ke-2 (domain, hosting, keamanan, perbaikan error)</td><td>${S.rupiah(CFG.biayaTahunan)}/tahun</td></tr>
      </table>
      <h2>Ketentuan</h2>
      <div class="terms">
        <div><b>✏️ Revisi maksimal ${CFG.maksRevisi || 3} kali</b>Setiap revisi boleh ubah total dari awal atau ganti konsep.</div>
        <div><b>🛠️ Error &amp; bug langsung dikerjakan</b>Tanpa biaya dan tidak mengurangi jatah revisi.</div>
        <div><b>📈 Progres bisa dipantau</b>Anda mendapat kode proyek untuk cek progres online.</div>
        <div><b>🔒 Tanpa biaya tersembunyi</b>Fitur tambahan diinformasikan harganya sebelum dikerjakan.</div>
      </div>
      <div class="sign"><div>Hormat kami,<b>Tim ${esc(CFG.brand)}</b></div><div style="text-align:right">Penawaran berlaku ${CFG.berlakuHari || 7} hari<br>sejak tanggal diterbitkan</div></div>
    </div>
  </article>`;
  const msg = `Halo Tim ${CFG.brand} 👋\n\nSaya dari *${Q.n}* setuju dengan penawaran *No. ${Q.no}* — paket *${p.nama}* (${S.rupiah(p.harga)}).\nMohon info langkah selanjutnya untuk pembayaran uang muka 🙏`;
  document.getElementById("agree").href = S.waLink((CFG.negotiator && CFG.negotiator.whatsapp) || CFG.waKantor, msg);
  window.HQ_CHAT_CTX = { halaman: "penawaran", usaha: Q.n };
})();
</script>
<script src="chat.js?v=20261030"></script>
</body>
</html>
